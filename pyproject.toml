[project]
name = "ares-service"
version = "0.1.0"
description = "Authorized-only wireless pentest platform — a WiFi-Pineapple clone for the operator's own network."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Calvin Ference" }]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.scripts]
ares = "ares.cli:app"

[project.urls]
Design = "https://github.com/vezril/codex/blob/main/docs/ares-wireless-pentest.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ares"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--cov=ares --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
